<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Discuss{% endblock %}</title>

    <!-- Prevent white flash on page load by applying 'dark' class immediately -->
    <script>
        if (
            localStorage.getItem('theme') === 'dark' ||
            (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- Tailwind CSS via Play CDN + Class-based Dark Mode Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <!-- Global Dark Mode Surface & Text Overrides for All Child Templates -->
    <style>
        html.dark body { background-color: #090d16; color: #f1f5f9; }
        html.dark header,
        html.dark article,
        html.dark section,
        html.dark aside > div,
        html.dark .bg-white { background-color: #111827 !important; }
        html.dark .bg-slate-50,
        html.dark .bg-slate-50\/80 { background-color: #161f33 !important; }
        html.dark .bg-slate-100 { background-color: #1e293b !important; }
        html.dark .border-slate-100,
        html.dark .border-slate-200,
        html.dark .border-slate-300 { border-color: #1f2937 !important; }
        html.dark .text-slate-900,
        html.dark .text-slate-800 { color: #f8fafc !important; }
        html.dark .text-slate-700,
        html.dark .text-slate-600 { color: #cbd5e1 !important; }
        html.dark .text-slate-500,
        html.dark .text-slate-400 { color: #94a3b8 !important; }
        html.dark input,
        html.dark textarea,
        html.dark select {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        html.dark .hover\:bg-slate-50:hover,
        html.dark .hover\:bg-slate-100:hover { background-color: #1e293b !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col transition-colors duration-150">

    <!-- Top Sticky Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between gap-4">
            
            <!-- Brand / Home Link -->
            <a href="{% url 'blog_home' %}" class="flex items-center gap-2 font-bold text-xl text-indigo-600 dark:text-indigo-400 tracking-tight">
                <span>Discuss</span>
            </a>

            <!-- Search Bar -->
            <form method="GET" action="{% url 'search_result' %}" class="flex-1 max-w-md">
                <input 
                    type="text" 
                    name="q" 
                    value="{{ request.GET.q|default:'' }}"
                    placeholder="Search communities or posts..." 
                    class="w-full bg-slate-100 border border-transparent focus:bg-white focus:border-indigo-500 rounded-full px-4 py-1.5 text-sm outline-none transition"
                >
            </form>

            <!-- Right Side Navigation -->
            <nav class="flex items-center gap-2.5 sm:gap-3 text-sm font-medium">

                <!-- Dark Mode Toggle Button -->
                <button 
                    type="button" 
                    id="theme-toggle" 
                    title="Toggle Dark Mode"
                    class="p-2 rounded-full bg-slate-100 hover:bg-slate-200/70 text-slate-700 transition cursor-pointer"
                >
                    <span id="theme-toggle-icon">🌙</span>
                </button>

                {% if user.is_authenticated %}
                    <a href="{% url 'create_subreddit' %}" class="hidden md:inline-block text-slate-600 hover:text-indigo-600 px-2.5 py-1.5 transition">
                        + Community
                    </a>
                    <a href="{% url 'add_blog' %}" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-1.5 rounded-full transition">
                        + Create Post
                    </a>

                    <!-- User Dropdown Menu -->
                    <div class="relative" id="user-menu-container">
                        <button 
                            type="button" 
                            id="user-menu-button"
                            class="flex items-center gap-1.5 text-slate-700 hover:text-indigo-600 bg-slate-100 hover:bg-slate-200/70 px-3 py-1.5 rounded-full transition cursor-pointer"
                        >
                            <span>u/{{ user.username }}</span>
                            <span class="text-xs text-slate-400">▾</span>
                        </button>

                        <!-- Dropdown Panel -->
                        <div 
                            id="user-menu-dropdown" 
                            class="hidden absolute right-0 mt-2 w-48 bg-white border border-slate-200 rounded-xl shadow-lg py-1.5 z-50"
                        >
                            <div class="px-4 py-2 border-b border-slate-100">
                                <p class="text-xs text-slate-400">Signed in as</p>
                                <p class="text-sm font-semibold text-slate-800 truncate">u/{{ user.username }}</p>
                            </div>

                            <a href="{% url 'password_change' %}" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-indigo-600 transition">
                                Change Password
                            </a>

                            <form method="POST" action="{% url 'logout' %}" class="border-t border-slate-100 mt-1 pt-1">
                                {% csrf_token %}
                                <button type="submit" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition cursor-pointer">
                                    Logout
                                </button>
                            </form>
                        </div>
                    </div>

                {% else %}
                    <a href="{% url 'login' %}" class="text-slate-600 hover:text-slate-900 px-3 py-1.5">Log In</a>
                    <a href="{% url 'register' %}" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-full transition">
                        Sign Up
                    </a>
                {% endif %}
            </nav>

        </div>
    </header>

    <!-- Django Flash Messages -->
    {% if messages %}
        <div class="max-w-6xl mx-auto w-full px-4 mt-4 space-y-2">
            {% for message in messages %}
                <div class="p-3 rounded-lg text-sm font-medium border 
                    {% if message.tags == 'error' %}bg-red-50 text-red-700 border-red-200
                    {% elif message.tags == 'success' %}bg-emerald-50 text-emerald-700 border-emerald-200
                    {% else %}bg-blue-50 text-blue-700 border-blue-200{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Main Page Content -->
    <main class="max-w-6xl mx-auto w-full px-4 py-6 flex-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Navbar Dropdown & Dark Mode Toggle Scripts -->
    <script>
        // 1. User Dropdown Toggle
        const menuBtn = document.getElementById('user-menu-button');
        const menuDropdown = document.getElementById('user-menu-dropdown');

        if (menuBtn && menuDropdown) {
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                menuDropdown.classList.toggle('hidden');
            });

            document.addEventListener('click', (e) => {
                if (!menuDropdown.contains(e.target)) {
                    menuDropdown.classList.add('hidden');
                }
            });
        }

        // 2. Dark Mode Toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleIcon = document.getElementById('theme-toggle-icon');

        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            themeToggleIcon.textContent = isDark ? '☀️' : '🌙';
        }

        updateThemeIcon();

        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        });
    </script>

</body>
</html>

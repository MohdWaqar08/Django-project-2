<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Reddit Clone{% endblock %}</title>

    <!-- Tailwind CSS compilation -->
    <script src="https://cdn.tailwindcss.com"></script>
    {% tailwind_css %}
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

    <!-- Global Header / Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
            
            <!-- Site Logo/Name -->
            <h1 class="text-xl font-extrabold text-indigo-600 tracking-tight">
                <a href="/">Reddit Clone</a>
            </h1>

            <!-- Global Search Bar -->
            {% if user.is_authenticated %}
            <div class="w-full sm:w-auto flex-1 max-w-md">
                <form action="{% url 'search_result' %}" method="GET" class="flex gap-2">
                    <input type="text" name="q" placeholder="Search entries..." required
                           class="w-full px-4 py-2 text-sm bg-slate-100 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition">
                        Search
                    </button>
                </form>
            </div>
            {% endif %}

            <!-- User Actions -->
            <div class="flex items-center gap-3">
                {% if user.is_authenticated %}
                    <a href="{% url 'add_blog' %}" class="text-sm font-medium text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-3 py-1.5 rounded-lg transition">+ Post</a>
                    <a href="{% url 'create_subreddit' %}" class="text-sm font-medium text-emerald-600 hover:text-emerald-800 bg-emerald-50 px-3 py-1.5 rounded-lg transition">+ Subreddit</a>
                    <form method="POST" action="{% url 'logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="text-sm font-medium text-rose-600 hover:text-rose-800 bg-rose-50 px-3 py-1.5 rounded-lg transition">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="text-sm font-medium text-slate-600 hover:text-slate-900 px-3 py-1.5">Login</a>
                    <a href="{% url 'register' %}" class="text-sm font-medium text-white bg-indigo-600 px-4 py-1.5 rounded-lg hover:bg-indigo-700 transition">Register</a>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Dynamic Content Area -->
    <main class="max-w-2xl mx-auto px-4 py-6">
        {% block content %}
        <!-- Child templates inject their content here -->
        {% endblock %}
    </main>

</body>
</html>

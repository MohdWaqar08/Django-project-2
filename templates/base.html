<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Discuss{% endblock %}</title>
    <!-- Tailwind CSS via Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col">

    <!-- Top Sticky Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between gap-4">
            
            <!-- Brand / Home Link -->
            <a href="{% url 'blog_home' %}" class="flex items-center gap-2 font-bold text-xl text-indigo-600 tracking-tight">
                <span>Discuss</span>
            </a>

            <!-- Search Bar -->
            <form method="GET" action="{% url 'search_result' %}" class="flex-1 max-w-md">
                <input 
                    type="text" 
                    name="q" 
                    value="{{ request.GET.q|default:'' }}"
                    placeholder="Search communities or posts..." 
                    class="w-full bg-slate-100 border border-transparent focus:bg-white focus:border-indigo-500 rounded-full px-4 py-1.5 text-sm outline-none transition"
                >
            </form>

            <!-- Right Side Navigation -->
            <nav class="flex items-center gap-3 text-sm font-medium">
                {% if user.is_authenticated %}
                    <a href="{% url 'create_subreddit' %}" class="hidden md:inline-block text-slate-600 hover:text-indigo-600 px-2.5 py-1.5 transition">
                        + Community
                    </a>
                    <a href="{% url 'add_blog' %}" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-1.5 rounded-full transition">
                        + Create Post
                    </a>
                    <span class="text-slate-600 hidden sm:inline">u/{{ user.username }}</span>
                    
                    <!-- Replace 'logout' below if your auth URL has a different name -->
                    <form method="POST" action="{% url 'logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="text-slate-500 hover:text-slate-800 px-2 py-1 cursor-pointer">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <!-- Replace 'login' and 'register' if your auth URLs have different names -->
                    <a href="{% url 'login' %}" class="text-slate-600 hover:text-slate-900 px-3 py-1.5">Log In</a>
                    <a href="{% url 'register' %}" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-full transition">
                        Sign Up
                    </a>
                {% endif %}
            </nav>

        </div>
    </header>

    <!-- Django Flash Messages -->
    {% if messages %}
        <div class="max-w-6xl mx-auto w-full px-4 mt-4 space-y-2">
            {% for message in messages %}
                <div class="p-3 rounded-lg text-sm font-medium border 
                    {% if message.tags == 'error' %}bg-red-50 text-red-700 border-red-200
                    {% elif message.tags == 'success' %}bg-emerald-50 text-emerald-700 border-emerald-200
                    {% else %}bg-blue-50 text-blue-700 border-blue-200{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Main Page Content -->
    <main class="max-w-6xl mx-auto w-full px-4 py-6 flex-1">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
